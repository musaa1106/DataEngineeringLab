version: 2

# These tests replace the hand-written quality checks (qc = {...}) from Practice 10.
models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category                # Part E exercise 5: only known categories allowed
        tests:
          - accepted_values:
              arguments: {values: ['Electronics', 'Furniture', 'Accessories']}

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_sales
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: date_key
        tests:
          - not_null
          - relationships:            # no orphan dates
              arguments: {to: ref('dim_date'), field: date_key}
      - name: customer_id
        tests:
          - not_null
          - relationships:            # no orphan customers
              arguments: {to: ref('dim_customer'), field: customer_id}
      - name: product_id
        tests:
          - not_null
          - relationships:            # no orphan products
              arguments: {to: ref('dim_product'), field: product_id}

  # ---- Part E -------------------------------------------------------------
  - name: mart_top5_products_per_category
    columns:
      - name: rank_in_category
        tests:
          - not_null
          - accepted_values:          # a top-5 list can only have ranks 1..5
              arguments: {values: [1, 2, 3, 4, 5], quote: false}

  - name: mart_revenue_growth
    columns:
      - name: ym
        tests: [unique, not_null]

  - name: mart_top_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
